[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tutor-socratico-tcc"
version = "0.1.0"
description = "MVP avaliável de tutor socrático multiagente para programação introdutória"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
    "argon2-cffi>=23.1,<26",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["ruff>=0.11,<1"]
analise = ["matplotlib>=3.8,<4"]

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
